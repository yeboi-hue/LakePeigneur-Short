name: Render Lake Peigneur Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -type f -name 'LakePeigneur-Short.zip' -not -path './.git/*' -print -quit || true)"
          if [ -n "$ZIP_FILE" ]; then
            echo "Found project archive: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d ./_project_extract
          else
            echo "No project ZIP found; will use project files already committed."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies and render
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_PATH="$(find . -type f -path '*/scripts/generate-narration.py' -not -path './.git/*' -print -quit || true)"
          if [ -z "$SCRIPT_PATH" ]; then
            echo "::error::Could not find scripts/generate-narration.py. Make sure LakePeigneur-Short.zip is uploaded to the repository root, or upload the extracted project folders."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$SCRIPT_PATH")")"
          echo "Using project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          test -f package.json
          test -f src/index.ts
          test -f scripts/generate-score.py
          test -f scripts/generate-sfx.py

          npm install
          npx remotion browser ensure
          python -m pip install --upgrade edge-tts
          python scripts/generate-narration.py
          python scripts/generate-score.py
          python scripts/generate-sfx.py

          npx remotion render src/index.ts LakePeigneurShort out/lake-peigneur.mp4 --codec h264 --crf 18 --scale 1 --concurrency 2

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp out/lake-peigneur.mp4 "$GITHUB_WORKSPACE/out/lake-peigneur.mp4"

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: lake-peigneur-short-mp4
          path: out/lake-peigneur.mp4
          if-no-files-found: error
          retention-days: 14
          
