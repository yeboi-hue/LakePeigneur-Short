
name: Render Lake Peigneur Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify project files
        run: |
          set -euo pipefail
          test -f package.json
          test -f src/index.ts
          test -f src/Root.tsx
          test -f scripts/generate-narration.py
          echo "Project files found."

      - name: Install Node dependencies
        run: npm install

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Generate narration and audio assets
        run: |
          set -euo pipefail
          python -m pip install --upgrade edge-tts
          python scripts/generate-narration.py

          if [ -f scripts/generate-score.py ]; then
            python scripts/generate-score.py
          fi

          if [ -f scripts/generate-sfx.py ]; then
            python scripts/generate-sfx.py
          elif [ -f scripts/make_sfx.py ]; then
            python scripts/make_sfx.py
          fi

      - name: Render MP4
        run: |
          mkdir -p out
          npx remotion render src/index.ts LakePeigneur out/lake-peigneur.mp4 --codec h264 --crf 18 --scale 1 --concurrency 2

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: lake-peigneur-short-mp4
          path: out/lake-peigneur.mp4
          if-no-files-found: error
          retention-days: 14
          
