name: Render Lake Peigneur Short
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          unzip -q LakePeigneur-Short.zip
          echo "PROJECT_DIR=LakePeigneur-Short" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        working-directory: LakePeigneur-Short
        run: npm install
      - name: Ensure Remotion browser
        working-directory: LakePeigneur-Short
        run: npx remotion browser ensure
      - name: Install narration generator
        run: python -m pip install --upgrade edge-tts
      - name: Generate narration
        working-directory: LakePeigneur-Short
        run: python scripts/generate-narration.py
      - name: Generate score and sound effects
        working-directory: LakePeigneur-Short
        run: |
          python scripts/generate-score.py
          python scripts/generate-sfx.py
      - name: Render MP4
        working-directory: LakePeigneur-Short
        run: npx remotion render src/index.ts LakePeigneurShort out/lake-peigneur.mp4 --codec h264 --crf 18 --scale 1 --concurrency 2
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: lake-peigneur-short-mp4
          path: LakePeigneur-Short/out/lake-peigneur.mp4
          if-no-files-found: error
          retention-days: 14
          
